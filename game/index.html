<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ff">
  <title>Прикинь!</title>
  <!-- Откуда брать контент: папка рядом с игрой или https-адрес папки на CDN (с CORS) -->
  <meta name="prikin-content" content="content/">
  <!-- Шрифты лежат рядом с игрой (OFL 1.1), никаких внешних хостов -->
  <link rel="preload" href="fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/onest.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <!-- Иконки игры: свои векторы, рисуются цветом текста -->
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4.5v4h4"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
    <symbol id="i-duel" viewBox="0 0 24 24"><circle cx="8.5" cy="8" r="3"/><path d="M3 19.5c0-3.1 2.5-5.5 5.5-5.5s5.5 2.4 5.5 5.5"/><circle cx="16.5" cy="9" r="2.5"/><path d="M15.8 14.1c2.9.3 5.2 2.4 5.2 5.4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
    <symbol id="i-paw" viewBox="0 0 24 24"><path d="M12 12.5c-3 0-5 2.7-5 4.7 0 1.4 1.1 2.1 2.4 2.1 1 0 1.6-.5 2.6-.5s1.6.5 2.6.5c1.3 0 2.4-.7 2.4-2.1 0-2-2-4.7-5-4.7z"/><circle cx="5.8" cy="10.2" r="1.7"/><circle cx="9.5" cy="6" r="1.8"/><circle cx="14.5" cy="6" r="1.8"/><circle cx="18.2" cy="10.2" r="1.7"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.3 2.3 3.4 5 3.4 8s-1.1 5.7-3.4 8c-2.3-2.3-3.4-5-3.4-8s1.1-5.7 3.4-8z"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5l5.5-2 6 2 5.5-2v13l-5.5 2-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></symbol>
    <symbol id="i-piggy" viewBox="0 0 24 24"><ellipse cx="11.5" cy="12.5" rx="7.5" ry="5.5"/><path d="M19 10.8h1.2a1 1 0 0 1 1 1v1.4a1 1 0 0 1-1 1H19M13.6 7.3l2.4-2.6.6 3.3M8 17.3v2.4M15 17.3v2.4M9.6 9.6h3.4M4 12c-1 0-1.6-.6-1.6-1.4"/><circle cx="16" cy="11.2" r=".3"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12.4V4.8c0-.7.6-1.3 1.3-1.3h7.6l8.3 8.3c.5.5.5 1.3 0 1.8l-7.3 7.3c-.5.5-1.3.5-1.8 0z"/><circle cx="8.3" cy="8.3" r="1.6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5.5 13.5H12L11 21l7.5-10.5H12z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 12h.01"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="M4 17l5.5-5.5 3.5 3.5L20 8"/><path d="M15 8h5v5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 17h-8l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 5 5z"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8.5 4v16M15.5 4v16M4 9h4.5M4 15h4.5M15.5 9H20M15.5 15H20"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.5-2h5L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-rumor" viewBox="0 0 24 24"><path d="M3.5 5h10v7.5h-5l-3 2.5v-2.5h-2z"/><path d="M16.5 9.5h4v7.5H19v2.5l-3-2.5h-5.5V15.5"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3.5" y="7" width="17" height="12" rx="2"/><path d="M9 3.5l3 3.5 3-3.5"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1v.1h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 8v3M11 8v4.5M15 8v3M19 8v4.5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-handoff" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="9" height="17" rx="2"/><path d="M7 17h2"/><path d="M15 12h6M18.5 9l2.5 3-2.5 3"/></symbol>
    <!-- рисованные украшения в стиле SberKids: звёздочки, сердечки, искры -->
    <symbol id="d-spark" viewBox="0 0 24 24"><path d="M12 1.5c.7 5.2 2.6 8 10.5 10.5-7.9 2.5-9.8 5.3-10.5 10.5-.7-5.2-2.6-8-10.5-10.5C9.4 9.5 11.3 6.7 12 1.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="d-star" viewBox="0 0 24 24"><path d="M12 3.2l2.5 5.6 6 .6-4.5 4.1 1.3 6-5.3-3.1-5.3 3.1 1.3-6L3.5 9.4l6-.6z"/></symbol>
    <symbol id="d-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></symbol>
    <symbol id="d-squiggle" viewBox="0 0 40 12"><path d="M2 8c4-6 8-6 12 0s8 6 12 0 8-6 12 0"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.2c0 4.3-3 7.8-7 9.8-4-2-7-5.5-7-9.8V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></symbol>
  </svg>

  <div id="bg" aria-hidden="true"></div>

  <!-- Старт -->
  <section class="screen" id="scr-start">
    <div class="doodles" aria-hidden="true">
      <svg class="dd dd1"><use href="#d-spark"/></svg>
      <svg class="dd dd2"><use href="#d-star"/></svg>
      <svg class="dd dd3"><use href="#d-heart"/></svg>
      <svg class="dd dd4"><use href="#d-spark"/></svg>
      <svg class="dd dd5" viewBox="0 0 40 12"><use href="#d-squiggle"/></svg>
      <svg class="dd dd6"><use href="#d-star"/></svg>
    </div>
    <div class="start-top">
      <div class="eyebrow">Детектор фейков</div>
      <h1 class="logo"><span>ПРИКИНЬ!</span></h1>
      <div class="ruler-deco" aria-hidden="true"></div>
      <p class="tagline" id="tagline">Фейк или правда? Растяни силуэт<br>до <b>настоящего</b> размера.</p>
      <div class="event" id="event" hidden><span class="chip-ic"><svg class="ic"><use href="#i-calendar"/></svg></span><div><b class="ev-title"></b><span class="ev-text"></span></div></div>
    </div>
    <div class="start-hero">
      <div class="capy capy-hero" id="capy-start"></div>
      <div class="hero-bubble" id="hero-bubble">Я Капи. Проверяю громкие заявления.</div>
    </div>
    <div class="start-btns">
      <button class="btn btn-primary btn-big" data-mode="chaos" disabled><svg class="ic"><use href="#i-search"/></svg>Раскрыть фейки</button>
      <div class="modes">
        <button class="tile" data-mode="animals" disabled><span class="chip-ic"><svg class="ic"><use href="#i-paw"/></svg></span><span>Звери<small>Вирусные фото</small></span></button>
        <button class="tile" data-mode="countries" disabled><span class="chip-ic"><svg class="ic"><use href="#i-globe"/></svg></span><span>Карты<small>Обман карты</small></span></button>
        <button class="tile" data-mode="prices" disabled><span class="chip-ic"><svg class="ic"><use href="#i-piggy"/></svg></span><span>Цены<small>В мороженках</small></span></button>
      </div>
      <button class="btn" id="btn-duel" disabled><svg class="ic"><use href="#i-duel"/></svg>Дуэль на одном телефоне</button>
      <div class="start-foot">
        <button class="btn btn-ghost btn-sm js-sound"><svg class="ic"><use href="#i-sound"/></svg><span>Звук</span></button>
        <p class="record" id="record" hidden></p>
      </div>
      <p class="load-error" id="load-error" hidden>Не получилось загрузить уровни. <button class="btn btn-sm" id="btn-reload"><svg class="ic"><use href="#i-retry"/></svg>Ещё раз</button></p>
    </div>
  </section>

  <!-- Игра -->
  <section class="screen" id="scr-game" hidden>
    <header class="hud">
      <div class="dots" id="dots"></div>
      <div class="combo" id="combo" hidden></div>
      <div class="hud-score" id="hud-score">0</div>
    </header>

    <article class="post" id="banner">
      <div class="post-head">
        <span class="post-ava" id="post-ava"></span>
        <span class="post-src" id="post-src"></span>
        <span class="post-tag" id="post-tag"></span>
      </div>
      <p class="claim" id="claim"></p>
      <div class="ask" id="ask"></div>
    </article>

    <div class="turn" id="turn" hidden></div>

    <div class="board" id="board"></div>

    <footer class="controls">
      <button class="icon-btn js-sound" aria-label="Звук"><svg class="ic"><use href="#i-sound"/></svg></button>
      <button class="icon-btn" id="btn-minus" aria-label="Меньше"><svg class="ic"><use href="#i-minus"/></svg></button>
      <button class="btn btn-primary btn-go" id="btn-go"><svg class="ic"><use href="#i-check"/></svg>Фиксирую</button>
      <button class="icon-btn" id="btn-plus" aria-label="Больше"><svg class="ic"><use href="#i-plus"/></svg></button>
    </footer>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-inner">
        <div class="res-head">
          <div class="res-main">
            <span class="res-badge" id="res-badge"></span>
            <div class="res-sub" id="res-sub"></div>
          </div>
          <div class="res-side">
            <div class="res-score" id="res-score"></div>
            <div class="res-rank" id="res-rank"></div>
          </div>
        </div>
        <div class="res-rows" id="res-rows"></div>
        <div class="res-box res-fact" id="res-fact-box">
          <div class="box-head"><span class="box-ic" id="fact-ic"></span><b id="fact-title">Почему фейк</b><span class="box-name" id="fact-name"></span></div>
          <p id="res-fact"></p>
        </div>
        <div class="res-box res-tip" id="res-tip-box">
          <div class="box-head"><span class="box-ic" id="tip-ic"></span><b id="tip-title">Факт</b></div>
          <p id="res-tip"></p>
        </div>
        <button class="btn btn-primary btn-big" id="btn-next"><span>Дальше</span><svg class="ic"><use href="#i-arrow"/></svg></button>
      </div>
    </div>
  </section>

  <!-- Итоги -->
  <section class="screen scroll" id="scr-end" hidden>
    <div class="end-head">
      <div class="end-kicker" id="end-kicker">Итог проверки</div>
      <div class="end-score" id="end-score"></div>
      <div class="end-title"><svg class="ic"><use href="#i-shield"/></svg><span id="end-title"></span></div>
      <div class="end-level" id="end-level"></div>
    </div>
    <div class="end-hero">
      <div class="capy capy-end" id="capy-end"></div>
      <div class="end-grid" id="end-grid"></div>
    </div>
    <div class="end-btns">
      <button class="btn btn-primary btn-big" id="btn-share"><svg class="ic"><use href="#i-share"/></svg>Отправить результат другу</button>
      <button class="btn" id="btn-again"><svg class="ic"><use href="#i-retry"/></svg>Ещё раз — новые пары</button>
    </div>
    <div class="panel" id="end-best"></div>
    <div class="panel" id="end-unlocks"></div>
    <div class="panel" id="end-lessons"></div>
    <div class="end-btns">
      <button class="btn" id="btn-to-duel"><svg class="ic"><use href="#i-duel"/></svg>Вызвать друга на дуэль</button>
      <button class="btn btn-ghost btn-sm" id="btn-menu"><svg class="ic"><use href="#i-menu"/></svg>В меню</button>
    </div>
  </section>

  <!-- Итоги дуэли -->
  <section class="screen scroll" id="scr-duel-end" hidden>
    <div class="end-head">
      <div class="end-kicker">Дуэль</div>
      <div class="duel-score" id="duel-score"></div>
      <div class="end-title"><svg class="ic"><use href="#i-trophy"/></svg><span id="duel-title"></span></div>
    </div>
    <div class="end-hero">
      <div class="capy capy-end" id="capy-duel"></div>
      <div class="end-grid duel" id="duel-grid"></div>
      <div class="duel-legend"><span class="p1">Игрок 1</span><span class="p2">Игрок 2</span><span class="p0">Ничья</span></div>
    </div>
    <div class="end-btns">
      <button class="btn btn-primary btn-big" id="btn-duel-share"><svg class="ic"><use href="#i-share"/></svg>Поделиться</button>
      <button class="btn" id="btn-rematch"><svg class="ic"><use href="#i-retry"/></svg>Реванш</button>
      <button class="btn btn-ghost btn-sm" id="btn-duel-menu"><svg class="ic"><use href="#i-menu"/></svg>В меню</button>
    </div>
  </section>

  <!-- Заставка раунда -->
  <div class="intro" id="intro" hidden>
    <div class="intro-tag" id="intro-tag"></div>
    <div class="intro-a" id="intro-a"></div>
    <div class="intro-vs"><i></i><span>VS</span><i></i></div>
    <div class="intro-b" id="intro-b"></div>
    <div class="intro-q" id="intro-q"></div>
  </div>

  <!-- Передай телефон -->
  <div class="overlay" id="pass" hidden>
    <div class="pass-card">
      <div class="pass-ic"><svg class="ic"><use href="#i-handoff"/></svg></div>
      <div class="pass-title" id="pass-title"></div>
      <p id="pass-text"></p>
      <button class="btn btn-primary btn-big" id="btn-pass"></button>
    </div>
  </div>

  <!-- Предпросмотр карточки «поделиться» -->
  <div class="overlay" id="share-view" hidden>
    <div class="share-card">
      <div class="share-title">Твоя карточка</div>
      <img id="share-img" alt="Карточка с результатом">
      <p class="share-note" id="share-note"></p>
      <button class="btn btn-primary btn-big" id="btn-share-ok">Готово</button>
    </div>
  </div>

  <!-- Закрыть игру: всегда в левом верхнем углу -->
  <button class="close-x" id="btn-close" aria-label="Закрыть игру"><svg class="ic"><use href="#i-x"/></svg></button>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="toast" id="toast" hidden></div>

  <script src="js/util.js?v=6"></script>
  <script src="js/bridge.js?v=6"></script>
  <script src="js/sound.js?v=6"></script>
  <script src="js/capy.js?v=6"></script>
  <script src="js/fx.js?v=6"></script>
  <script src="js/assets.js?v=6"></script>
  <script src="js/content.js?v=6"></script>
  <script src="js/board.js?v=6"></script>
  <script src="js/share.js?v=6"></script>
  <script src="js/game.js?v=6"></script>
</body>
</html>
