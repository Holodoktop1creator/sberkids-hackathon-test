<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140f2b">
  <title>Прикинь!</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

  <!-- Старт -->
  <section class="screen" id="scr-start">
    <div class="start-top">
      <h1 class="logo" aria-label="Прикинь!"></h1>
      <p class="tagline" id="tagline">Фейк или правда? Растяни силуэт<br>до <b>настоящего</b> размера!</p>
      <div class="event" id="event" hidden><b></b><span></span></div>
    </div>
    <div class="start-hero">
      <div class="float f1">🐋</div><div class="float f2">🌍</div><div class="float f3">🦒</div><div class="float f4">🐝</div>
      <div class="capy capy-hero" id="capy-start"></div>
      <div class="hero-bubble" id="hero-bubble">Йо! Я Капи — детектор фейков 🕵️</div>
    </div>
    <div class="start-btns">
      <button class="btn btn-big btn-chaos" data-mode="chaos" disabled>🕵️ РАСКРЫТЬ ФЕЙКИ</button>
      <div class="row">
        <button class="btn btn-mode" data-mode="animals" disabled>🐾 Звери</button>
        <button class="btn btn-mode" data-mode="countries" disabled>🗺️ Карты</button>
      </div>
      <button class="btn btn-violet" id="btn-duel" disabled>⚔️ Дуэль на одном телефоне</button>
      <button class="btn btn-ghost btn-sm js-sound">🔊 Звук</button>
      <p class="record" id="record" hidden></p>
      <p class="load-error" id="load-error" hidden>Не получилось загрузить уровни 🙈 <button class="btn btn-ghost btn-sm" id="btn-reload">Ещё раз</button></p>
    </div>
  </section>

  <!-- Игра -->
  <section class="screen" id="scr-game" hidden>
    <header class="hud">
      <div class="dots" id="dots"></div>
      <div class="combo" id="combo" hidden></div>
      <div class="hud-score" id="hud-score">0</div>
    </header>

    <div class="banner" id="banner">
      <div class="kicker" id="kicker"></div>
      <div class="claim" id="claim"></div>
      <div class="ask" id="ask"></div>
    </div>

    <div class="turn" id="turn" hidden></div>

    <div class="board" id="board"></div>


    <footer class="controls">
      <button class="icon-btn js-sound" aria-label="Звук">🔊</button>
      <button class="icon-btn" id="btn-minus" aria-label="Меньше">−</button>
      <button class="btn btn-go" id="btn-go">ФИКСИРУЮ!</button>
      <button class="icon-btn" id="btn-plus" aria-label="Больше">+</button>
    </footer>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-inner">
        <div class="res-head">
          <div class="res-score" id="res-score"></div>
          <div class="res-rank" id="res-rank"></div>
        </div>
        <div class="res-ratio" id="res-ratio"></div>
        <div class="res-fact"><div class="fact-head"><b id="fact-title">🕵️ ПОЧЕМУ ФЕЙК</b><span class="fact-name" id="fact-name"></span></div><p id="res-fact"></p></div>
        <div class="res-tip" id="res-tip"></div>
        <button class="btn btn-big" id="btn-next">Дальше →</button>
      </div>
    </div>
  </section>

  <!-- Итоги -->
  <section class="screen scroll" id="scr-end" hidden>
    <div class="end-head">
      <div class="end-kicker" id="end-kicker">Итог</div>
      <div class="end-score" id="end-score"></div>
      <div class="end-title" id="end-title"></div>
    </div>
    <div class="capy capy-end" id="capy-end"></div>
    <div class="end-grid" id="end-grid"></div>
    <div class="end-btns">
      <button class="btn btn-big" id="btn-share">📤 Кинуть результат другу</button>
      <button class="btn btn-violet" id="btn-again">↺ Ещё раз (новые пары)</button>
    </div>
    <div class="panel" id="end-best"></div>
    <div class="panel" id="end-unlocks"></div>
    <div class="panel" id="end-lessons"></div>
    <div class="end-btns">
      <button class="btn btn-ghost" id="btn-to-duel">⚔️ Вызвать друга на дуэль</button>
      <button class="btn btn-ghost btn-sm" id="btn-menu">В меню</button>
    </div>
  </section>

  <!-- Итоги дуэли -->
  <section class="screen scroll" id="scr-duel-end" hidden>
    <div class="end-head">
      <div class="end-kicker">Дуэль</div>
      <div class="duel-score" id="duel-score"></div>
      <div class="end-title" id="duel-title"></div>
    </div>
    <div class="capy capy-end" id="capy-duel"></div>
    <div class="end-grid" id="duel-grid"></div>
    <div class="end-btns">
      <button class="btn btn-big" id="btn-duel-share">📤 Поделиться</button>
      <button class="btn btn-violet" id="btn-rematch">⚔️ Реванш</button>
      <button class="btn btn-ghost btn-sm" id="btn-duel-menu">В меню</button>
    </div>
  </section>

  <!-- Заставка раунда -->
  <div class="intro" id="intro" hidden>
    <div class="intro-tag" id="intro-tag"></div>
    <div class="intro-a" id="intro-a"></div>
    <div class="intro-vs">VS</div>
    <div class="intro-b" id="intro-b"></div>
  </div>

  <!-- Передай телефон -->
  <div class="overlay" id="pass" hidden>
    <div class="pass-card">
      <div class="pass-emoji">📱➡️🙈</div>
      <div class="pass-title" id="pass-title"></div>
      <p id="pass-text"></p>
      <button class="btn btn-big" id="btn-pass"></button>
    </div>
  </div>

  <!-- Предпросмотр карточки «поделиться» -->
  <div class="overlay" id="share-view" hidden>
    <div class="share-card">
      <div class="share-title">Твоя карточка 📤</div>
      <img id="share-img" alt="Карточка с результатом">
      <p class="share-note" id="share-note"></p>
      <button class="btn btn-big" id="btn-share-ok">Готово</button>
    </div>
  </div>

  <!-- Закрыть игру: всегда в левом верхнем углу -->
  <button class="close-x" id="btn-close" aria-label="Закрыть игру">✕</button>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="toast" id="toast" hidden></div>

  <script src="js/util.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/capy.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/content.js"></script>
  <script src="js/board.js"></script>
  <script src="js/share.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
